name: Check PaperMC Updates
on:
  schedule:
    - cron: '*/10 * * * *'  # Vérification toutes les 10 minutes
  workflow_dispatch:        # Permet de tester manuellement

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python script.py

      - name: Save Cache
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Mise à jour du cache de build [Skip CI]"
          file_pattern: 'last_build.json'
