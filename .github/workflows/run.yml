name: Check PaperMC Updates
on:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests
      - name: Run script
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }} # Pour cacher ton lien webhook
        run: python script.py
